name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch cancels the previous run. Without this, a
# rapid series of pushes queues several full pipelines and the useful one —
# the latest — waits behind runs nobody is looking at any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Static checks ──────────────────────────────────────────────────────────
  # Fast, dependency-free, and run in parallel: a lint error should not wait
  # for Postgres to boot before it tells you.
  static:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every failure in one run, not one per push
      matrix:
        check: [lint, format, typecheck]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        # Every package under packages/* resolves through its built dist, so
        # typecheck fails without this. Filtered by path rather than by name:
        # naming @cc/shared alone is what broke when @cc/ats landed, and it
        # would break again for @cc/ai in slice 1.6.
        run: pnpm --filter "./packages/*" build
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            lint)      pnpm lint ;;
            format)    pnpm format:check ;;
            typecheck) pnpm typecheck ;;
          esac

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    services:
      # Real Postgres and Redis, not mocks. The append-only trigger, refresh
      # rotation, and rate limiting are all database and Redis behaviour — an
      # ORM mock would pass while production stayed broken.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: cc_ci_password
          POSTGRES_DB: career_copilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cc -d career_copilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cc:cc_ci_password@localhost:5432/career_copilot?schema=public
      REDIS_URL: redis://localhost:6379
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:5173
      # Test-only values. Real secrets never enter CI for a pull request.
      JWT_SECRET: ci-only-jwt-secret-value-at-least-32-chars-long
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_PROVIDER: mock
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: cc_minio
      STORAGE_SECRET_ACCESS_KEY: cc_minio_ci_password
      STORAGE_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build

      # MinIO runs as a step rather than a service container because a service
      # cannot override the image's command, and the official MinIO image needs
      # `server /data` to start at all. Export tests write real objects and read
      # back real pre-signed URLs — mocking the S3 client here would assert that
      # we call the SDK the way we call it, which is not the question.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cc_minio \
            -e MINIO_ROOT_PASSWORD=cc_minio_ci_password \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set ci http://localhost:9000 cc_minio cc_minio_ci_password &&
            mc mb --ignore-existing ci/cc-exports &&
            mc mb --ignore-existing ci/cc-uploads"

      - name: Apply migrations
        # `migrate deploy`, never `migrate dev`: deploy is non-interactive and
        # applies exactly the committed migrations. A migration that fails to
        # apply to a clean database fails here rather than in production.
        run: pnpm --filter @cc/api exec prisma migrate deploy

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always() # useful precisely when the run failed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: apps/api/coverage/
          retention-days: 7

  # ── Build and bundle budget ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check bundle budget
        # A performance budget nobody enforces is a wish. This fails the build.
        run: node scripts/check-bundle-size.mjs

  # ── Dependency audit ───────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high

  # ── Container image ────────────────────────────────────────────────────────
  docker:
    name: Image build and scan
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          # Explicit, and not optional. The Dockerfile has a `worker` stage
          # after this one, and `docker build` with no target builds the LAST
          # stage — so omitting this silently tagged the 1.3 GB worker image,
          # Chromium and all, as the API. The size gate caught it.
          target: runtime
          push: false
          load: true
          tags: cc-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: cc-api:${{ github.sha }}
          format: table
          exit-code: '1' # a HIGH or CRITICAL finding fails the build
          severity: HIGH,CRITICAL
          ignore-unfixed: true # no fix available means no action to take

      # The worker is a separate target because it carries Chromium, which has
      # no business in the image that serves HTTP. Built here so a change to the
      # shared build stage cannot break it unnoticed — it is the image that
      # renders every PDF a user downloads.
      - name: Build worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          push: false
          load: true
          tags: cc-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan worker image
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: cc-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Check image size
        run: |
          # The gate is 800 MB; the TARGET is 300 MB and is currently unmet —
          # this runner measures ~499 MB for the linux/amd64 image that actually
          # gets deployed. A gate pinned at an aspiration fails on every run and
          # gets switched off, so this one is set where it can catch a
          # regression while the real target stays recorded in docs/00-TRD.md
          # and docs/tracker.md as work still to do.
          #
          # The weight is Prisma. @prisma/client@7 declares `prisma` as an
          # OPTIONAL peer, so `pnpm deploy --prod` keeps the peer-resolved
          # variant and everything beneath it: the CLI, Prisma Studio, @prisma/dev,
          # pglite, TypeScript, effect, even react-dom — none of it reachable
          # from dist/index.js. Deleting those by hand reached 464 MB but also
          # removed @prisma/client-runtime-utils, which the generated client
          # loads at startup, so the container stopped booting.
          # Two different numbers get called "image size" and they differ by ~5x
          # here, so both are printed. `docker image inspect` reports the
          # UNPACKED size under the classic image store that GitHub runners use;
          # under the containerd store (common locally) the same command reports
          # the COMPRESSED size instead. Measuring locally and gating in CI
          # therefore compares two different quantities unless you say which.
          BYTES=$(docker image inspect cc-api:${{ github.sha }} --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "docker images reports: $(docker images cc-api:${{ github.sha }} --format '{{.Size}}')"
          echo "Image size: ${MB} MB (gate 800 MB, target 300 MB)"
          if [ "$MB" -gt 800 ]; then
            echo "::error::Image is ${MB} MB, over the 800 MB regression gate"
            exit 1
          fi
          if [ "$MB" -gt 300 ]; then
            echo "::warning::Image is ${MB} MB, over the 300 MB target (tracked)"
          fi
