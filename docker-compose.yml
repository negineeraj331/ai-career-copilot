name: career-copilot

services:
  postgres:
    # pgvector image rather than plain postgres:16 — semantic JD matching (FR-36)
    # stores embeddings in the same database instead of a second datastore.
    image: pgvector/pgvector:pg16
    container_name: cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc_dev_password
      POSTGRES_DB: career_copilot
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cc -d career_copilot']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: unless-stopped
    # AOF on: BullMQ jobs must survive a restart during development, otherwise
    # queue behaviour locally diverges from production.
    command: redis-server --appendonly yes
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible, so the ObjectStore adapter is identical in local, staging,
    # and production. No "works on my machine" storage path.
    image: minio/minio:latest
    container_name: cc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cc_minio
      MINIO_ROOT_PASSWORD: cc_minio_dev_password
    ports:
      - '59000:9000' # API
      - '59001:9001' # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cc_minio cc_minio_dev_password &&
      mc mb --ignore-existing local/cc-uploads &&
      mc mb --ignore-existing local/cc-exports &&
      echo 'buckets ready'
      "

  mailhog:
    # Captures every outbound email so verification and reset flows are testable
    # without a real SMTP provider or a real inbox.
    image: axllent/mailpit:latest
    container_name: cc-mailhog
    restart: unless-stopped
    ports:
      - '51025:1025' # SMTP
      - '58025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  redis-data:
  minio-data:
